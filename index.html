    function formatRun(r, s, bold) {
        let rPr = child(r, 'rPr');
        if (!rPr) {
            rPr = r.ownerDocument.createElementNS(W, 'w:rPr');
            r.insertBefore(rPr, r.firstChild);
        }
        formatRPr(rPr, s, bold);
    }
    function formatRPr(rPr, s, bold) {
        const f = ensure(rPr, 'rFonts', RPR_ORDER);
        const cur = f.getAttributeNS(W, 'ascii') || '';
        if (!/courier|consolas|mono|lucida console/i.test(cur)) { // моноширинный шрифт (код) оставляем
            for (const a of ['asciiTheme', 'hAnsiTheme', 'eastAsiaTheme', 'csTheme']) f.removeAttributeNS(W, a);
            const font = s.fontFamily || FONT;
            setAttrs(f, { ascii: font, hAnsi: font, cs: font, eastAsia: font });
        }
        const half = Math.round(s.fontSize * 2);
        setAttrs(ensure(rPr, 'sz', RPR_ORDER), { val: half });
        setAttrs(ensure(rPr, 'szCs', RPR_ORDER), { val: half });
        if (bold) { ensure(rPr, 'b', RPR_ORDER); ensure(rPr, 'bCs', RPR_ORDER); }
    }

    // стили-заголовки (по имени "heading N" / outlineLvl) из styles.xml
    function headingStyleIds(stDoc) {
        const ids = { headings: [], listStyles: [] };
        if (!stDoc) return ids;
        const bases = {};
        let styleCount = 0;
        for (const st of Array.from(stDoc.getElementsByTagNameNS(W, 'style'))) {
            const id = st.getAttributeNS(W, 'styleId');
            const nm = child(st, 'name');
            const name = nm ? (nm.getAttributeNS(W, 'val') || '') : '';
            const pPr = child(st, 'pPr');
            if (pPr && child(pPr, 'numPr')) ids.listStyles.push(id);
            const base = child(st, 'basedOn');
            if (base) { bases[id] = base.getAttributeNS(W, 'val'); styleCount++; }
            if (/^(heading|заголовок|title|название)/i.test(name) || (pPr && child(pPr, 'outlineLvl'))) ids.headings.push(id);
        }
        for (let i = 0; i < styleCount; i++) {
            let changed = false;
            for (const id in bases) {
                const base = bases[id];
                if (ids.headings.indexOf(base) >= 0 && ids.headings.indexOf(id) < 0) { ids.headings.push(id); changed = true; }
                if (ids.listStyles.indexOf(base) >= 0 && ids.listStyles.indexOf(id) < 0) { ids.listStyles.push(id); changed = true; }
            }
            if (!changed) break;
        }
        return ids;
    }

    // ширина текста в твипсах -> сжимаем таблицы и рисунки, которые не влезают в новые поля
    function fitWidths(xmlDoc, textW, settings) {
        function pageSpace(node) {
            let width = textW;
            let height = 16838 - Math.round(((settings && settings.top + settings.bottom) || 40) * MM);
            if (!settings) return { width: width, height: height };
            const body = xmlDoc.getElementsByTagNameNS(W, 'body')[0];
            let top = node;
            while (top.parentNode && top.parentNode !== body) top = top.parentNode;
            for (let element = top; element; element = element.nextElementSibling) {
                const section = element.localName === 'sectPr' ? element : element.getElementsByTagNameNS(W, 'sectPr')[0];
                if (!section) continue;
                const size = child(section, 'pgSz');
                const landscape = size && (size.getAttributeNS(W, 'orient') === 'landscape' || Number(size.getAttributeNS(W, 'w')) > Number(size.getAttributeNS(W, 'h')));
                width = (landscape ? 16838 : 11906) - Math.round((settings.left + settings.right) * MM);
                height = (landscape ? 11906 : 16838) - Math.round((settings.top + settings.bottom) * MM);
                const columns = child(section, 'cols');
                if (columns) {
                    const count = Number(columns.getAttributeNS(W, 'num')) || columns.getElementsByTagNameNS(W, 'col').length || 1;
                    const gap = Number(columns.getAttributeNS(W, 'space')) || 0;
                    width = (width - gap * (count - 1)) / count;
                    const column = child(columns, 'col');
                    if (column && Number(column.getAttributeNS(W, 'w')) > 0) width = Math.min(width, Number(column.getAttributeNS(W, 'w')));
                }
                break;
            }
            for (let parent = node.parentNode; parent && parent !== body; parent = parent.parentNode) {
                if (parent.localName !== 'tc') continue;
                const properties = child(parent, 'tcPr');
                const cellWidth = properties && child(properties, 'tcW');
                if (cellWidth && cellWidth.getAttributeNS(W, 'type') === 'dxa') width = Math.min(width, Math.max(1, Number(cellWidth.getAttributeNS(W, 'w')) - 216));
            }
            return { width: width, height: height };
        }
        function widthFor(node) {
            return pageSpace(node).width;
        }
        for (const tbl of Array.from(xmlDoc.getElementsByTagNameNS(W, 'tbl'))) {
            const grid = child(tbl, 'tblGrid');
            if (!grid) continue;
            const cols = [];
            let total = 0;
            for (let index = 0; index < grid.children.length; index++) {
                const column = grid.children[index];
                if (column.localName !== 'gridCol') continue;
                cols.push(column);
                total += parseInt(column.getAttributeNS(W, 'w'), 10) || 0;
            }
            const width = widthFor(tbl);
            if (!total || total <= width) continue;
            const k = width / total;
            for (let index = 0; index < cols.length; index++) {
                setAttrs(cols[index], { w: Math.floor((parseInt(cols[index].getAttributeNS(W, 'w'), 10) || 0) * k) });
            }
            for (const w of Array.from(tbl.getElementsByTagNameNS(W, 'tcW')).concat(Array.from(tbl.getElementsByTagNameNS(W, 'tblW')))) {
                let owner = w.parentNode;
                while (owner && owner.localName !== 'tbl') owner = owner.parentNode;
                if (owner !== tbl) continue;
                if (w.getAttributeNS(W, 'type') === 'dxa') setAttrs(w, { w: Math.floor((parseInt(w.getAttributeNS(W, 'w'), 10) || 0) * k) });
            }
        }
        const WP = 'http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing';
        const A = 'http://schemas.openxmlformats.org/drawingml/2006/main';
        const anchors = Array.from(xmlDoc.getElementsByTagNameNS(WP, 'anchor'));
        for (let index = 0; index < anchors.length; index++) {
            const anchor = anchors[index];
            const inline = xmlDoc.createElementNS(WP, 'wp:inline');
            for (const name of ['extent', 'effectExtent', 'docPr', 'cNvGraphicFramePr']) {
                const elements = anchor.getElementsByTagNameNS(WP, name);
                if (elements.length) inline.appendChild(elements[0].cloneNode(true));
            }
            const graphic = anchor.getElementsByTagNameNS(A, 'graphic')[0];
            if (graphic) {
                inline.appendChild(graphic.cloneNode(true));
                anchor.parentNode.replaceChild(inline, anchor);
            }
        }
        for (const inl of Array.from(xmlDoc.getElementsByTagNameNS(WP, 'inline'))) {
            const space = pageSpace(inl);
            const maxWidth = Math.max(1, space.width - 120) * 635;
            const maxHeight = Math.max(1, space.height - 960) * 635;
            const ext = inl.getElementsByTagNameNS(WP, 'extent')[0];
            if (!ext) continue;
            const cx = parseInt(ext.getAttribute('cx'), 10), cy = parseInt(ext.getAttribute('cy'), 10);
            if (!(cx > 0 && cy > 0)) continue;
            const scale = Math.min(1, maxWidth / cx, maxHeight / cy);
            ext.setAttribute('cx', String(Math.floor(cx * scale)));
            ext.setAttribute('cy', String(Math.floor(cy * scale)));
            const transforms = inl.getElementsByTagNameNS(A, 'xfrm');
            for (let index = 0; index < transforms.length; index++) {
                const dimensions = transforms[index].getElementsByTagNameNS(A, 'ext')[0];
                if (!dimensions) continue;
                dimensions.setAttribute('cx', String(Math.floor(Number(dimensions.getAttribute('cx')) * scale)));
                dimensions.setAttribute('cy', String(Math.floor(Number(dimensions.getAttribute('cy')) * scale)));
            }
            const effects = inl.getElementsByTagNameNS(WP, 'effectExtent')[0];
            if (effects) {
                for (const side of ['l', 't', 'r', 'b']) {
                    if (effects.hasAttribute(side)) effects.setAttribute(side, String(Math.floor(Number(effects.getAttribute(side)) * scale)));
                }
            }
            for (let parent = inl.parentNode; parent; parent = parent.parentNode) {
                if (parent.localName !== 'tr') continue;
                const rowProperties = child(parent, 'trPr');
                const rowHeight = rowProperties && child(rowProperties, 'trHeight');
                if (rowHeight && rowHeight.getAttributeNS(W, 'hRule') === 'exact') setAttrs(rowHeight, { hRule: 'atLeast' });
            }
        }
        const vml = 'urn:schemas-microsoft-com:vml';
        const shapes = xmlDoc.getElementsByTagNameNS(vml, 'shape');
        for (let index = 0; index < shapes.length; index++) {
            const shape = shapes[index];
            if (!shape.getElementsByTagNameNS(vml, 'imagedata').length) continue;
            const style = shape.getAttribute('style') || '';
            const width = style.match(/(?:^|;)\s*width\s*:\s*([\d.]+)(pt|px|in|cm|mm)/i);
            const height = style.match(/(?:^|;)\s*height\s*:\s*([\d.]+)(pt|px|in|cm|mm)/i);
            if (!width || !height) continue;
            const units = { pt: 20, px: 15, in: 1440, cm: MM * 10, mm: MM };
            const space = pageSpace(shape);
            const scale = Math.min(1, (space.width - 120) / (Number(width[1]) * units[width[2].toLowerCase()]), (space.height - 960) / (Number(height[1]) * units[height[2].toLowerCase()]));
            if (scale < 1 && scale > 0) {
                let resized = style.replace(width[0], width[0].replace(width[1] + width[2], (Number(width[1]) * scale).toFixed(3) + width[2]));
                resized = resized.replace(height[0], height[0].replace(height[1] + height[2], (Number(height[1]) * scale).toFixed(3) + height[2]));
                shape.setAttribute('style', resized);
            }
        }
    }

    // удаление титульного листа, уже имеющегося в загруженном документе
    function removeExistingTitle(xmlDoc) {
        // титульников может быть несколько подряд (например, файл уже обрабатывался ранее)
        let n = 0;
        while (n < 4 && removeOneTitle(xmlDoc)) n++;
        return n > 0;
    }

    function removeOneTitle(xmlDoc) {
        const body = xmlDoc.getElementsByTagNameNS(W, 'body')[0];
        const range = titleRange(xmlDoc);
        if (!range) return false;
        for (const el of range) body.removeChild(el);
        return true;
    }

    function formatBody(xmlDoc, s, headStyles) {
        const body = xmlDoc.getElementsByTagNameNS(W, 'body')[0];
        const line = Math.round(s.lineSpacing * 240);
        const indent = Math.round(s.indent * MM);
        fitWidths(xmlDoc, 11906 - Math.round((s.left + s.right) * MM), s);

        for (const p of Array.from(xmlDoc.getElementsByTagNameNS(W, 'p'))) {
            let pPr = child(p, 'pPr');
            if (!pPr) { pPr = xmlDoc.createElementNS(W, 'w:pPr'); p.insertBefore(pPr, p.firstChild); }

            const pStyle = child(pPr, 'pStyle');
            const style = pStyle ? (pStyle.getAttributeNS(W, 'val') || '') : '';
            const heading = headStyles.headings.indexOf(style) >= 0 || /^(heading|заголовок|title|название)/i.test(style) || !!child(pPr, 'outlineLvl');
            const hasImage = p.getElementsByTagNameNS(W, 'drawing').length > 0 || p.getElementsByTagNameNS(W, 'pict').length > 0;
            const imageOnly = hasImage && !paragraphText(p);
            const listed = !!child(pPr, 'numPr') || headStyles.listStyles.indexOf(style) >= 0;
            const table = inTable(p);
            const hasText = p.textContent.trim().length > 0;
            const jcEl = child(pPr, 'jc');
            const jc = jcEl ? jcEl.getAttributeNS(W, 'val') : '';
            const aligned = jc === 'center' || jc === 'right' || jc === 'end';

            const sp = ensure(pPr, 'spacing', PPR_ORDER);
            for (const a of ['beforeLines', 'afterLines', 'beforeAutospacing', 'afterAutospacing']) sp.removeAttributeNS(W, a);
            setAttrs(sp, { line: table ? 240 : line, lineRule: 'auto', before: 0, after: heading ? 240 : 0 });
            if (hasImage) {
                setAttrs(sp, { line: 240, lineRule: 'auto', before: 0, after: 0 });
                if (imageOnly) {
                    setAttrs(ensure(pPr, 'keepLines', PPR_ORDER), { val: 1 });
                    removeAll(pPr, 'keepNext');
                }
            }

            if (!table && !listed) {
                const ind = ensure(pPr, 'ind', PPR_ORDER);
                for (const a of ['firstLine', 'hanging', 'firstLineChars', 'hangingChars']) ind.removeAttributeNS(W, a);
                if (!heading && hasText && !aligned) setAttrs(ind, { firstLine: indent });
                else setAttrs(ind, { firstLine: 0 });
            }
            if (!table && !heading && hasText && !aligned) setAttrs(ensure(pPr, 'jc', PPR_ORDER), { val: 'both' });
            if (imageOnly && !table) setAttrs(ensure(pPr, 'jc', PPR_ORDER), { val: 'center' });
            if (heading) setAttrs(sp, { before: 240, after: 240 });

            const markRPr = child(pPr, 'rPr');
            if (markRPr) formatRPr(markRPr, s, heading);
            for (const r of Array.from(p.getElementsByTagNameNS(W, 'r'))) formatRun(r, s, heading);
        }

        // страница A4 + поля + нумерация страниц
        const sects = [];
        const allSections = xmlDoc.getElementsByTagNameNS(W, 'sectPr');
        for (let index = 0; index < allSections.length; index++) {
            if (allSections[index].parentNode.localName !== 'pPrChange') sects.push(allSections[index]);
        }
        if (!sects.length) {
            const sp = xmlDoc.createElementNS(W, 'w:sectPr');
            body.appendChild(sp);
            sects.push(sp);
        }
        for (let index = 0; index < sects.length; index++) {
            const sp = sects[index];
            const sz = ensure(sp, 'pgSz', SECT_ORDER);
            const landscape = sz.getAttributeNS(W, 'orient') === 'landscape' || Number(sz.getAttributeNS(W, 'w')) > Number(sz.getAttributeNS(W, 'h'));
            setAttrs(sz, landscape ? { w: 16838, h: 11906, orient: 'landscape' } : { w: 11906, h: 16838 });
            setAttrs(ensure(sp, 'pgMar', SECT_ORDER), {
                top: Math.round(s.top * MM), right: Math.round(s.right * MM),
                bottom: Math.round(s.bottom * MM), left: Math.round(s.left * MM),
                header: 709, footer: 709, gutter: 0
            });
            let hasFooter = false;
            for (let childIndex = 0; childIndex < sp.children.length; childIndex++) {
                const reference = sp.children[childIndex];
                if (reference.localName === 'footerReference' && reference.getAttributeNS(W, 'type') === 'default') hasFooter = true;
            }
            if (hasFooter) continue;
            const fr = xmlDoc.createElementNS(W, 'w:footerReference');
            setAttrs(fr, { type: 'default' });
            fr.setAttributeNS(R, 'r:id', s.footerId || 'rIdGostFooter');
            let before = null;
            for (let childIndex = 0; childIndex < sp.children.length; childIndex++) {
                if (SECT_ORDER.indexOf(sp.children[childIndex].localName) > SECT_ORDER.indexOf('footerReference')) {
                    before = sp.children[childIndex];
                    break;
                }
            }
            sp.insertBefore(fr, before || null);
        }
    }

    const TITLE_LABELS = [
        ['institute', /институт$/i],
        ['department', /кафедра$/i],
        ['topic', /(тема|тақырыбы|тақырып|subject matter)$/i],
        ['teacher', /(преподаватель|оқытушы|оқытушының аты-жөні|checked by)$/i],
        ['student', /(студент|магистрант|written by|witten by|білім алушының аты-жөні|білім алушы)$/i],
        ['specialty', /(специальность|мамандығы|мамандық шифрі|мамандық)$/i],
        ['group', /(группа|тобы|топ|group)$/i]
    ];

    function pickTemplate(entry, language) {
        const order = [language || sourceLang || currentLang, 'ru', 'kk', 'en'];
        for (const l of order) if (entry.t[l] !== undefined) return { key: String(entry.t[l]), lang: l };
        return null;
    }

    function labelOf(buf) {
        const b = buf.replace(/[\s:\u00ac\u00ad_.,;]+$/g, '').trim();
        for (let index = 0; index < TITLE_LABELS.length; index++) {
            if (TITLE_LABELS[index][1].test(b)) return TITLE_LABELS[index][0];
        }
        return null;
    }

    // подставляет значения вместо линий ____ после подписей (Тема, Студент, Группа ...) и год
    function fillTemplate(container, v) {
        const paras = Array.from(container.getElementsByTagNameNS(W, 'p'));
        for (let idx = 0; idx < paras.length; idx++) {
            const p = paras[idx];
            const ts = Array.from(p.getElementsByTagNameNS(W, 't'));
            if (!ts.length) continue;
            let full = '';
            for (let textIndex = 0; textIndex < ts.length; textIndex++) full += ts[textIndex].textContent;

            // год: «Алматы 2018 г»
            if (/^\s*(алматы|almaty)\s+\d{4}/i.test(full)) {
                ts[0].textContent = full.replace(/\b\d{4}\b/, v.year || '____');
                for (let textIndex = 1; textIndex < ts.length; textIndex++) ts[textIndex].textContent = '';
                continue;
            }
            if (!/_{3,}/.test(full)) continue;

            // казахские формы: «______ институты», «______ кафедрасы»
            const suffix = /институты\s*$/i.test(full) ? 'institute' : /кафедрасы\s*$/i.test(full) ? 'department' : null;

            // подпись может стоять в предыдущем абзаце (форма «Зертханалық»)
            let prevText = '';
            if (idx > 0 && !full.replace(/[_\s]/g, '')) prevText = paras[idx - 1].textContent;

            let buf = prevText, lastFilled = false;
            for (const t of ts) {
                const parts = t.textContent.split(/(_+)/);
                let out = '';
                for (const part of parts) {
                    if (/^_+$/.test(part)) {
                        let name = suffix || labelOf(buf);
                        const val = name ? v[name] : '';
                        if (val) {
                            const sep = (!buf || /[\s:]$/.test(buf) || /[\s:]$/.test(out)) ? '' : ' ';
                            out += sep + val + (suffix ? ' ' : '');
                            lastFilled = true;
                        }
                        else if (!buf.trim() && lastFilled) { /* продолжение подчёркивания после заполненного поля */ }
                        else { out += part; lastFilled = false; }
                        buf = '';
                    } else {
                        out += part;
                        if (part.trim()) lastFilled = false;
                        buf += part;
                    }
                }
                t.textContent = out;
                t.setAttribute('xml:space', 'preserve');
            }
        }
    }

    function prepareTitle(root, settings, entry, language) {
        const paragraphs = Array.from(root.getElementsByTagNameNS(W, 'p'));
        let titleParagraph = null;
        let studentParagraph = null;
        for (let index = 0; index < paragraphs.length; index++) {
            const paragraph = paragraphs[index];
            if (inTable(paragraph)) continue;
            const text = paragraphText(paragraph);
            const type = workType(text);
            if (!titleParagraph && type && (type === entry.id || (entry.id === 'en_lab' && type === 'lab') || (entry.id === 'en_report' && type === 'otchet'))) titleParagraph = paragraph;
            if (!studentParagraph && /_{3}/.test(text) && /студент|магистрант|written by|witten by|білім алушы/i.test(text)) studentParagraph = paragraph;
        }
        const names = settings.students && settings.students.length ? settings.students : [settings.author || ''];
        const data = {
            topic: settings.topic, student: names[0], specialty: settings.code, year: settings.year,
            institute: settings.institute, department: settings.department, teacher: settings.teacher, group: settings.group
        };
        fillTemplate(root, data);
        if (!studentParagraph && names[0]) {
            for (let index = 0; index < paragraphs.length; index++) {
                if (!inTable(paragraphs[index]) && paragraphText(paragraphs[index]).indexOf(names[0]) >= 0) {
                    studentParagraph = paragraphs[index];
                    break;
                }
            }
        }
        if (studentParagraph && names.length > 1 && names[0]) {
            let previous = studentParagraph;
            for (let index = 1; index < names.length; index++) {
                const copy = studentParagraph.cloneNode(true);
                const textNodes = copy.getElementsByTagNameNS(W, 't');
                const text = names[index];
                if (textNodes.length) {
                    textNodes[0].textContent = text;
                    for (let position = 1; position < textNodes.length; position++) textNodes[position].textContent = '';
                }
                const properties = child(copy, 'pPr');
                if (properties) removeAll(properties, 'sectPr');
                const control = copy.ownerDocument.createElementNS(W, 'w:sdt');
                const controlProperties = ensure(control, 'sdtPr', ['sdtPr', 'sdtContent']);
                setAttrs(ensure(controlProperties, 'tag', ['tag']), { val: 'norm-student-v1' });
                ensure(control, 'sdtContent', ['sdtPr', 'sdtContent']).appendChild(copy);
                previous.parentNode.insertBefore(control, previous.nextSibling);
                previous = control;
            }
        }
        if (!titleParagraph) throw new Error('В шаблоне не найден заголовок работы: ' + entry.ru);
        if (settings.number) {
            if (!/^\d+(?:[.-]\d+)*$/.test(settings.number)) throw new Error('Номер работы должен содержать цифры.');
            const textNodes = titleParagraph.getElementsByTagNameNS(W, 't');
            if (textNodes.length) textNodes[textNodes.length - 1].textContent += ' №' + settings.number;
        }
        const allParagraphs = root.getElementsByTagNameNS(W, 'p');
        for (let index = 0; index < allParagraphs.length; index++) {
            const paragraph = allParagraphs[index];
            const runs = paragraph.getElementsByTagNameNS(W, 'r');
            const fontSettings = { fontSize: settings.fontSize, fontFamily: settings.fontFamily };
            if (inTable(paragraph)) fontSettings.fontSize = Math.min(10, settings.fontSize);
            for (let position = 0; position < runs.length; position++) {
                if (runs[position].getElementsByTagNameNS(W, 't').length) formatRun(runs[position], fontSettings, false);
            }
        }
        const properties = ensure(titleParagraph, 'pPr', PPR_ORDER);
        setAttrs(ensure(properties, 'jc', PPR_ORDER), { val: 'center' });
        const indent = ensure(properties, 'ind', PPR_ORDER);
        for (const attribute of ['hanging', 'leftChars', 'rightChars', 'firstLineChars', 'hangingChars']) indent.removeAttributeNS(W, attribute);
        setAttrs(indent, { left: 0, right: 0, firstLine: 0 });
        setAttrs(ensure(properties, 'spacing', PPR_ORDER), { before: 0, after: 120, line: Math.round(settings.lineSpacing * 240), lineRule: 'auto' });
        setAttrs(ensure(properties, 'keepNext', PPR_ORDER), { val: 1 });
        const runs = titleParagraph.getElementsByTagNameNS(W, 'r');
        for (let index = 0; index < runs.length; index++) {
            formatRun(runs[index], settings, true);
            const runProperties = child(runs[index], 'rPr');
            setAttrs(ensure(runProperties, 'b', RPR_ORDER), { val: 1 });
            setAttrs(ensure(runProperties, 'bCs', RPR_ORDER), { val: 1 });
            setAttrs(ensure(runProperties, 'color', RPR_ORDER), { val: '000000' });
            removeAll(runProperties, 'vanish');
            removeAll(runProperties, 'webHidden');
        }
    }

    function insertTitlePage(xmlDoc, s) {
        const data = window.TITLE_DATA;
        let entry = null;
        for (let index = 0; index < ENTRIES.length; index++) {
            if (ENTRIES[index].id === s.docTypeId) { entry = ENTRIES[index]; break; }
        }
        if (!entry) throw new Error('Выберите тип работы.');
        const pick = pickTemplate(entry, s.language);
        if (!data || !pick || !data.blocks[pick.key]) throw new Error('title template missing');

        const frag = new DOMParser().parseFromString(`<root ${data.ns} xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture" xmlns:a14="http://schemas.microsoft.com/office/drawing/2010/main">${data.blocks[pick.key]}</root>`, 'application/xml');
        if (frag.getElementsByTagName('parsererror').length) throw new Error('title page xml');
        const root = frag.documentElement;
        prepareTitle(root, s, entry, pick.lang);
        const wp = 'http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing';
        let drawingId = 0;
        const drawingProperties = xmlDoc.getElementsByTagNameNS(wp, 'docPr');
        for (let index = 0; index < drawingProperties.length; index++) drawingId = Math.max(drawingId, Number(drawingProperties[index].getAttribute('id')) || 0);
        for (const e of Array.from(root.getElementsByTagNameNS(wp, 'docPr'))) e.setAttribute('id', String(++drawingId));

        // последний элемент шаблона несёт разрыв секции (поля — как в оригинальном бланке)
        const sect = new DOMParser().parseFromString(`<w:sectPr xmlns:w="${W}">${data.sect}</w:sectPr>`, 'application/xml').documentElement;
        setAttrs(ensure(sect, 'pgMar', SECT_ORDER), {
            top: Math.round(s.top * MM), bottom: Math.round(s.bottom * MM),
            left: Math.round(s.left * MM), right: Math.round(s.right * MM), header: 709, footer: 709, gutter: 0
        });
        let last = root.lastElementChild;
        if (!last || last.localName !== 'p') {
            last = frag.createElementNS(W, 'w:p');
            const pPr0 = frag.createElementNS(W, 'w:pPr');
            const sp0 = frag.createElementNS(W, 'w:spacing');
            setAttrs(sp0, { before: 0, after: 0, line: 20, lineRule: 'exact' });
            pPr0.appendChild(sp0);
            last.appendChild(pPr0);
            root.appendChild(last);
        }
        let lpPr = child(last, 'pPr');
        if (!lpPr) { lpPr = frag.createElementNS(W, 'w:pPr'); last.insertBefore(lpPr, last.firstChild); }
        const old = child(lpPr, 'sectPr');
        if (old) lpPr.removeChild(old);
        const slot = ensure(lpPr, 'sectPr', PPR_ORDER);
        for (const c of Array.from(sect.children)) slot.appendChild(frag.importNode(c, true));

        const body = xmlDoc.getElementsByTagNameNS(W, 'body')[0];
        const wrapper = xmlDoc.createElementNS(W, 'w:sdt');
        const props = xmlDoc.createElementNS(W, 'w:sdtPr');
        const tag = xmlDoc.createElementNS(W, 'w:tag');
        setAttrs(tag, { val: 'norm-title-v1' });
        props.appendChild(tag);
        wrapper.appendChild(props);
        const content = xmlDoc.createElementNS(W, 'w:sdtContent');
        wrapper.appendChild(content);
        for (const el of Array.from(root.children)) content.appendChild(xmlDoc.importNode(el, true));
        body.insertBefore(wrapper, body.firstChild);

        // какие картинки использует шаблон
        const used = [];
        for (const match of data.blocks[pick.key].matchAll(/r:embed="(rIdTpl\d+)"/g)) {
            if (used.indexOf(match[1]) < 0) used.push(match[1]);
        }
        return used;
    }

    function footerXml(s) {
        const sz = Math.round(s.fontSize * 2);
        const rpr = `<w:rPr><w:rFonts w:ascii="${esc(s.fontFamily || FONT)}" w:hAnsi="${esc(s.fontFamily || FONT)}" w:cs="${esc(s.fontFamily || FONT)}" w:eastAsia="${esc(s.fontFamily || FONT)}"/><w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/></w:rPr>`;
        return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:ftr xmlns:w="${W}" xmlns:r="${R}"><w:p><w:pPr><w:jc w:val="center"/></w:pPr>` +
            `<w:fldSimple w:instr=" PAGE "><w:r>${rpr}<w:t>1</w:t></w:r></w:fldSimple></w:p></w:ftr>`;
    }

    async function buildDocx(file, settings, openedDocument) {
        let source = openedDocument;
        if (!source || source.file !== file) source = await openDocx(file);
        if (source.analysis.state === 'uncertain') {
            const error = new Error('Укажите конец титула.');
            error.code = 'TITLE_BOUNDARY';
            throw error;
        }
        const zip = source.zip.clone();
        const xmlDoc = source.xmlDoc.cloneNode(true);
        const s = {};
        for (const key in settings) s[key] = settings[key];
        s.language = source.analysis.metadata.language;
        const parser = new DOMParser();
        const pkg = await preparePackage(zip);
        s.footerId = pkg.footerId;

        const stFile0 = zip.file('word/styles.xml');
        const stDoc0 = stFile0 ? parser.parseFromString(await stFile0.async('string'), 'application/xml') : null;
        const titleRemoved = source.analysis.state === 'existing';
        if (titleRemoved) removeTitlePrefix(xmlDoc, source.analysis.boundary);
        formatBody(xmlDoc, s, headingStyleIds(stDoc0));
        const usedMedia = insertTitlePage(xmlDoc, s);
        fitWidths(xmlDoc, 11906 - Math.round((s.left + s.right) * MM), s);

        // шрифт и размер по умолчанию в styles.xml
        const stFile = zip.file('word/styles.xml');
        if (stFile) {
            const st = parser.parseFromString(await stFile.async('string'), 'application/xml');
            const rd = st.getElementsByTagNameNS(W, 'rPrDefault')[0];
            const rPr = rd && child(rd, 'rPr');
            if (rPr) {
                formatRPr(rPr, s, false);
                zip.file('word/styles.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + new XMLSerializer().serializeToString(st.documentElement));
            }
        }

        // Связи шаблона получают отдельные идентификаторы.
        let usesFooter = false;
        const footerReferences = xmlDoc.getElementsByTagNameNS(W, 'footerReference');
        for (let index = 0; index < footerReferences.length; index++) {
            if (footerReferences[index].getAttributeNS(R, 'id') === pkg.footerId) usesFooter = true;
        }
        if (usesFooter) zip.file('word/' + pkg.footerName, footerXml(s));
        else {
            const relationships = pkg.relDoc.documentElement.children;
            for (let index = relationships.length - 1; index >= 0; index--) {
                if (relationships[index].getAttribute('Id') === pkg.footerId) relationships[index].remove();
            }
            const types = pkg.ctDoc.documentElement.children;
            for (let index = types.length - 1; index >= 0; index--) {
                if (types[index].getAttribute('PartName') === '/word/' + pkg.footerName) types[index].remove();
            }
        }
        const title = xmlDoc.getElementsByTagNameNS(W, 'body')[0].firstElementChild;
        for (const id of usedMedia) {
            const m = window.TITLE_DATA.media[id];
            if (!m) throw new Error('Отсутствует изображение титула: ' + id);
            let name = 'media/norm_' + m.name;
            const existing = zip.file('word/' + name);
            if (existing && await existing.async('base64') !== m.b64) name = pkg.uniquePart(name);
            if (!zip.file('word/' + name)) zip.file('word/' + name, m.b64, { base64: true });
            const newId = pkg.addRel(R + '/image', name);
            for (const e of Array.from(title.getElementsByTagName('*'))) {
                if (e.getAttributeNS(R, 'embed') === id) e.setAttributeNS(R, 'r:embed', newId);
            }
            pkg.contentType('Override', '/word/' + name, m.type);
        }
        zip.file('word/document.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + new XMLSerializer().serializeToString(xmlDoc.documentElement));
        zip.file('word/_rels/document.xml.rels', new XMLSerializer().serializeToString(pkg.relDoc));
        zip.file('[Content_Types].xml', new XMLSerializer().serializeToString(pkg.ctDoc));

        const result = await zip.generateAsync({
            type: 'blob',
            mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
            compression: 'DEFLATE'
        });
        result.titleWarning = '';
        if (titleRemoved) result.titleWarning = currentLang === 'kk'
            ? 'Бар титул таңдалған үлгіге келтірілді.'
            : 'Существующий титул приведён к выбранному шаблону.';
        return result;
    }

    async function processDocument() {
        if (!selectedFile || importPending) return;
        if (importedDocument && importedDocument.file === selectedFile && importedDocument.analysis.state === 'uncertain') {
            showTitleBoundary();
            return;
        }
        clearTimeout(debounceTimer);
        const token = ++runToken;
        const file = selectedFile;
        invalidateResult();
        const box = document.getElementById('docx-preview-box');
        const btn = document.getElementById('process-btn');
        showError('');
        btn.disabled = true;
        btn.innerText = TEXTS[currentLang].processing;
        try {
            const settings = readSettings();
            const blob = await buildDocx(file, settings, importedDocument);
            if (token !== runToken) return;
            if (typeof docx === 'undefined') throw new Error('Не загрузилась библиотека предпросмотра. Проверьте подключение к сети.');
            const staging = document.createElement('div');
            await docx.renderAsync(blob, staging, null, { className: 'docx', inWrapper: true, breakPages: true, ignoreLastRenderedPageBreak: true });
            if (token !== runToken) return;
            box.replaceChildren();
            while (staging.firstChild) box.appendChild(staging.firstChild);
            box.classList.remove('docx-preview-empty');
            resultBlob = blob;
            resultName = file.name.replace(/\.docx$/i, '') + '_formatted.docx';
            fitPreview();
            document.getElementById('document-status').textContent = blob.titleWarning;
            document.getElementById('download-word-btn').disabled = false;
            document.getElementById('download-pdf-btn').disabled = false;
        } catch (e) {
            console.error(e);
            if (token === runToken) {
                invalidateResult();
                box.replaceChildren();
                box.classList.add('docx-preview-empty');
                showError(e.message || TEXTS[currentLang].error_docx);
            }
        } finally {
            if (token === runToken) {
                btn.disabled = !selectedFile;
                btn.innerText = TEXTS[currentLang].process_button;
            }
        }
    }

    function fitPreview() {
        const box = document.getElementById('docx-preview-box');
        const wrap = box.querySelector('.docx-wrapper');
        if (!wrap || box.clientWidth < 100) return;
        const pages = box.querySelectorAll('section.docx');
        let pageWidth = 794;
        for (let index = 0; index < pages.length; index++) pageWidth = Math.max(pageWidth, pages[index].offsetWidth);
        let fit = Math.min(1, (box.clientWidth - 32) / (pageWidth + 32));
        const z = Math.max(0.1, fit) * previewZoom / 100;
        wrap.style.setProperty('zoom', String(z), 'important');
        document.getElementById('zoom-label').textContent = Math.round(z * 100) + '%';
        updatePageCount();
    }

    function setPreviewMode(mode) {
        previewMode = mode;
        const cover = mode === 'cover';
        document.getElementById('docx-preview-box').classList.toggle('cover-only', cover);
        document.getElementById('cover-tab').classList.toggle('active', cover);
        document.getElementById('document-tab').classList.toggle('active', !cover);
        document.getElementById('cover-tab').setAttribute('aria-pressed', String(cover));
        document.getElementById('document-tab').setAttribute('aria-pressed', String(!cover));
        document.getElementById('docx-preview-box').scrollTop = 0;
        fitPreview();
    }

    function changeZoom(change) {
        previewZoom = Math.max(40, Math.min(180, previewZoom + change));
        fitPreview();
    }

    function updatePageCount() {
        const box = document.getElementById('docx-preview-box');
        const pages = box.querySelectorAll('section.docx');
        let current = pages.length ? 1 : 0;
        if (previewMode === 'document') {
            const top = box.getBoundingClientRect().top;
            for (let index = 0; index < pages.length; index++) {
                if (pages[index].getBoundingClientRect().top <= top + box.clientHeight / 2) current = index + 1;
            }
        }
        document.getElementById('page-count').textContent = current + ' / ' + pages.length;
    }
    function resizePreviewLayout() {
        const left = document.querySelector('.left-settings-col');
        const right = document.querySelector('.center-main-col');
        const top = right.getBoundingClientRect().top + window.scrollY;
        let height = Math.max(left.offsetHeight, window.innerHeight - top - 20, 560);
        if (window.innerWidth <= 640) height = Math.max(500, window.innerHeight * 0.75);
        right.style.height = height + 'px';
        fitPreview();
    }
    window.addEventListener('resize', resizePreviewLayout);

    function downloadWord() {
        if (!resultBlob) return;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(resultBlob);
        a.download = resultName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    }

    function printPDF() {
        if (!resultBlob) return;
        window.print();
    }

    function clearAll() {
        runToken++;
        clearTimeout(debounceTimer);
        importPending = false;
        importedDocument = null;
        changedFields = {};
        hideTitleBoundary();
        sourceLang = null;
        importSummary = '';
        document.getElementById('document-status').textContent = '';
        invalidateResult();
        selectedFile = null;
        resultBlob = null;
        document.getElementById('file-input').value = "";
        for (let index = 0; index < FIELD_IDS.length; index++) {
            document.getElementById(FIELD_IDS[index]).value = '';
            store(FIELD_IDS[index], '');
        }
        setStudents([]);
        document.getElementById('page-count').textContent = '0 / 0';
        document.getElementById('title_year').value = '';
        selectFormatPreset('gost');

        document.getElementById('process-btn').disabled = true;
        document.getElementById('download-word-btn').disabled = true;
        document.getElementById('download-pdf-btn').disabled = true;
        showError('');

        const box = document.getElementById('docx-preview-box');
        box.innerHTML = "";
        box.classList.add('docx-preview-empty');
        updateUI();
    }

    (function init() {
        const savedLang = load('lang');
        if (savedLang && TEXTS[savedLang]) {
            currentLang = savedLang;
            document.getElementById('lang-select').value = savedLang;
        }
        initFormatPresets();
        updateUI();
        if (window.ResizeObserver) new ResizeObserver(fitPreview).observe(document.getElementById('docx-preview-box'));
        if (window.ResizeObserver) new ResizeObserver(resizePreviewLayout).observe(document.querySelector('.left-settings-col'));
        resizePreviewLayout();

        // Реквизиты относятся только к текущему документу.
        document.getElementById('docx-preview-box').addEventListener('scroll', updatePageCount);
        document.getElementById('file-input').addEventListener('click', function () { this.value = ''; });
        const dropZone = document.getElementById('drop-zone');
        dropZone.addEventListener('dragover', function (event) { event.preventDefault(); });
        dropZone.addEventListener('drop', function (event) {
            event.preventDefault();
            handleFile({ files: event.dataTransfer.files });
        });
        for (let index = 0; index < FIELD_IDS.length; index++) {
            document.getElementById(FIELD_IDS[index]).addEventListener('input', function (event) {
                changedFields[event.target.id] = true;
                scheduleProcess();
            });
        }
        document.getElementById('document_type').addEventListener('change', function () {
            changedFields.document_type = true;
            scheduleProcess();
        });
        for (let index = 0; index < SETTING_IDS.length; index++) {
            document.getElementById(SETTING_IDS[index]).addEventListener('input', function () {
                document.getElementById('preset-status').textContent = currentLang === 'kk' ? 'Өзгерістер сақталмаған.' : 'Есть несохранённые изменения.';
                scheduleProcess();
            });
        }
    })();
</script>
