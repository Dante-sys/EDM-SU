<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление работы — Satbayev University</title>
    <style>
:root { --accent:#ef3838; --ink:#182132; --muted:#647084; --border:#dce2ea; --paper:#fff; --canvas:#edf0f5; }
* { box-sizing:border-box; }
body { margin:0; color:var(--ink); background:#f6f8fb; font:14px Arial,sans-serif; }
button,input,select,textarea { font:inherit; }
button,summary { cursor:pointer; }
button:disabled { cursor:not-allowed; opacity:.45; }
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
header { height:68px; padding:0 32px; display:flex; align-items:center; justify-content:space-between; background:white; border-bottom:1px solid var(--border); }
.brand { display:flex; align-items:center; }
.brand img { display:block; width:170px; height:auto; max-height:50px; object-fit:contain; }
.header-right { display:flex; align-items:center; gap:25px; color:var(--muted); font-size:13px; }
.language-switch { display:flex; padding:3px; gap:2px; border:1px solid var(--border); border-radius:8px; background:#f1f3f6; }
.language-switch button { border:0; border-radius:5px; padding:7px 9px; background:transparent; color:var(--muted); font-size:12px; }
.language-switch button[aria-pressed="true"] { background:white; color:var(--accent); box-shadow:0 1px 3px #18213215; font-weight:600; }
.block-container { max-width:1440px; margin:auto; padding:20px 28px; }
.page-title { margin:0 0 16px; font-size:26px; letter-spacing:-.6px; }
.file-uploader-box { display:flex; align-items:center; gap:12px; position:relative; background:white; padding:12px 16px; border:1px solid var(--border); border-radius:8px; margin-bottom:16px; min-height:54px; }
.file-uploader-box:focus-within { outline:2px solid var(--accent); }
#upload-label { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
.upload-action { display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; padding:10px 14px; border:1px solid var(--accent); border-radius:7px; background:var(--accent); color:white; white-space:nowrap; font-size:13px; font-weight:600; box-shadow:0 2px 5px #ef383826; }
.replace-file { padding:7px 13px; border:1px solid var(--border); border-radius:6px; color:var(--muted); }
.file-uploader-box input { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; }
.main-layout { display:grid; grid-template-columns:330px minmax(0,1fr); gap:16px; align-items:start; }
.card { background:white; border:1px solid var(--border); border-radius:9px; min-width:0; }
.left-settings-col { padding:16px; }
.settings-heading { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
.title-subtitle { font-size:16px; font-weight:700; }
.form-group { display:flex; flex-direction:column; gap:5px; margin-bottom:10px; min-width:0; }
.form-group label { font-size:12px; color:#4d586b; }
.form-group input,.form-group select,.form-group textarea { width:100%; min-width:0; border:1px solid #ccd4df; border-radius:6px; padding:8px 10px; background:white; color:var(--ink); }
.form-group textarea { resize:vertical; line-height:1.4; min-height:62px; }
.form-pair { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.student-row { display:flex; align-items:center; gap:6px; margin-bottom:7px; }
.student-row input { flex:1; min-width:0; }
.remove-student { width:28px; height:30px; border:0; border-radius:5px; background:#f3f5f8; color:var(--muted); }
.primary-student { position:relative; }
.primary-student input { padding-right:40px; }
.add-student { position:absolute; right:5px; top:50%; transform:translateY(-50%); width:28px; height:28px; color:#8992a0; border:0; background:transparent; font-size:23px; line-height:1; }
.form-group input:disabled,.form-group select:disabled { background:#f1f3f6; color:#8992a0; cursor:not-allowed; opacity:1; }
.preset-actions { display:flex; gap:5px; }
.preset-actions .st-btn { flex:1; padding:7px 5px; font-size:11px; }
.preset-actions #delete-preset-btn { flex:0 0 36px; color:var(--accent); }
.preset-picker { position:relative; }
.preset-picker #preset_name { padding-right:38px; }
.preset-picker #preset_name:read-only { color:#8992a0; background:#f1f3f6; }
.preset-picker #format_preset { position:absolute; right:4px; top:4px; bottom:4px; width:29px; display:grid; place-items:center; border:0; border-radius:5px; padding:0; background:var(--accent); color:white; transition:background .16s,box-shadow .16s,opacity .18s; }
.preset-picker #format_preset:hover { background:#d72e2e; box-shadow:0 2px 6px #ef383833; }
#format_preset svg { transition:transform .18s; }
.preset-picker.is-open #format_preset svg { transform:rotate(180deg); }
.preset-menu { position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:20; max-height:220px; overflow-y:auto; padding:5px; border:1px solid var(--border); border-radius:9px; background:white; box-shadow:0 8px 24px #18213222; opacity:0; visibility:hidden; pointer-events:none; transform:translateY(-6px) scale(.98); transform-origin:top; transition:opacity .18s,transform .18s,visibility .18s; }
.preset-picker.is-open .preset-menu { opacity:1; visibility:visible; pointer-events:auto; transform:translateY(0) scale(1); }
.preset-option { display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; padding:10px; border:0; border-radius:5px; background:white; color:var(--ink); text-align:left; font-size:13px; overflow-wrap:anywhere; transition:background .14s,color .14s,opacity .18s; }
.preset-option:hover,.preset-option:focus-visible { background:#f3f5f8; }
.preset-option[aria-selected="true"] { background:#fff0f0; color:var(--accent); font-weight:600; }
.preset-option[aria-selected="true"]::after { content:'✓'; flex-shrink:0; }
.preset-option.preset-create { margin-top:5px; border-top:1px solid var(--border); border-radius:0 0 5px 5px; color:var(--accent); font-weight:600; }
@media (prefers-reduced-motion:reduce) { .preset-menu,.preset-option,#format_preset,#format_preset svg { transition:none; } }
.preset-status { font-size:11px; color:var(--muted); margin:8px 0 12px; line-height:1.4; }
.preset-status:empty { display:none; }
.center-main-col { display:flex; flex-direction:column; min-width:0; min-height:0; height:650px; }
.center-main-col > .card { flex:1; display:flex; flex-direction:column; min-height:0; }
.preview-title-block,.preview-footer,#title-boundary-panel,.button-row { flex-shrink:0; }
details { border:1px solid var(--border); border-radius:6px; margin-bottom:9px; }
summary { padding:10px; font-size:13px; font-weight:600; }
.details-body { padding:0 10px 4px; }
.st-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:37px; border-radius:6px; padding:9px 15px; font-size:13px; font-weight:600; border:1px solid var(--border); background:white; color:var(--ink); }
.btn-primary { background:var(--accent); border-color:var(--accent); color:white; }
.btn-primary:hover:enabled { background:#d72e2e; }
.apply-row { display:grid; grid-template-columns:1fr; margin-top:13px; }
#clear-btn { width:30px; min-height:30px; flex-shrink:0; padding:3px; font-size:19px; color:var(--muted); }
.preview-title-block { min-height:48px; display:flex; align-items:center; gap:18px; padding:0 14px; border-bottom:1px solid var(--border); }
#preview-title { font-weight:700; }
.preview-tabs { display:flex; align-self:stretch; }
.preview-tab { border:0; background:white; padding:0 12px; font-size:12px; color:var(--muted); border-bottom:2px solid transparent; }
.preview-tab.active { color:var(--ink); border-bottom-color:var(--accent); }
.zoom-tools { display:flex; align-items:center; gap:9px; margin-left:auto; font-size:12px; color:var(--muted); }
.zoom-tools button { width:27px; height:27px; background:white; border:1px solid var(--border); border-radius:5px; color:var(--ink); }
.docx-preview { flex:1; height:0; min-height:max(460px,calc(100vh - 340px)); overflow:auto; background:var(--canvas); color:black; }
.docx-preview .docx-wrapper { background:transparent !important; padding:16px !important; }
.docx-preview-empty { display:flex; align-items:center; justify-content:center; color:#a8b1c0; font-size:44px; }
.docx-preview.cover-only section.docx:not(:first-of-type) { display:none; }
.preview-footer { display:flex; align-items:center; justify-content:space-between; gap:15px; min-height:35px; padding:8px 14px; color:var(--muted); font-size:11px; }
#document-status { white-space:pre-line; }
#document-status:not(:empty)::before { content:'✓ '; color:#12924c; }
.button-row { display:flex; justify-content:flex-end; gap:10px; padding-top:10px; }
.alert-error { display:none; border:1px solid #efbbbb; border-radius:6px; color:#a52222; background:#fff1f1; padding:12px; margin-bottom:12px; }
#title-boundary-panel { padding:14px; border-bottom:1px solid var(--border); }
#title-boundary-message { margin:0; }
#title-boundary-list { max-height:320px; overflow:auto; margin:12px 0; }
button,summary,a,.form-group input,.form-group select,.form-group textarea,.upload-action,.replace-file { transition:opacity .18s ease; }
@media (hover:hover) and (pointer:fine) {
    button:enabled:hover,summary:hover,a:hover,.form-group input:enabled:not([readonly]):hover,.form-group select:enabled:hover,.form-group textarea:enabled:hover { opacity:.86; }
    .file-uploader-box:hover .upload-action,.file-uploader-box:hover .replace-file { opacity:.86; }
}
@media (prefers-reduced-motion:reduce) { button,summary,a,.form-group input,.form-group select,.form-group textarea,.upload-action,.replace-file,.preset-picker #format_preset,.preset-option { transition:none; } }
@media (min-width:1200px) and (max-height:850px) { .block-container { padding-top:14px; } .left-settings-col { padding:13px; } .form-group { margin-bottom:8px; } .form-group input,.form-group select { padding:7px 9px; } .docx-preview { min-height:450px; } }
@media (max-width:850px) { header { padding:0 16px; } .block-container { padding:16px; } .main-layout { grid-template-columns:285px minmax(0,1fr); gap:12px; } .preview-title-block { flex-wrap:wrap; padding:8px; gap:5px; } .preview-tabs { height:34px; } .docx-preview { min-height:420px; } }
@media (max-width:640px) { .main-layout { grid-template-columns:1fr; } .page-title { font-size:23px; } .docx-preview { height:65vh; min-height:360px; } .replace-file { font-size:11px; padding:6px; } .zoom-tools { gap:5px; } }
@media print { @page { size:A4; margin:0; } header,.left-settings-col,.file-uploader-box,.page-title,.button-row,.preview-title-block,.preview-footer,.alert-error,#title-boundary-panel { display:none !important; } body { background:white; } .block-container { padding:0; max-width:none; } .main-layout,.center-main-col,.center-main-col > .card { display:block; height:auto !important; } .card { border:0; } .docx-preview { height:auto; min-height:0; overflow:visible; background:white; } .docx-preview .docx-wrapper { padding:0 !important; zoom:1 !important; } .docx-preview section.docx { display:block !important; margin:0 !important; box-shadow:none !important; } }
    </style>
</head>
<body>
<header>
    <div class="brand"><img src="assets/satbayev-logo.png" alt="Satbayev University"></div>
    <div class="header-right">
        <div class="language-switch" id="language-switch" role="group" aria-label="Язык интерфейса">
            <button type="button" data-lang="ru" onclick="switchLanguage('ru')" aria-pressed="true">РУС</button><button type="button" data-lang="kk" onclick="switchLanguage('kk')" aria-pressed="false">ҚАЗ</button><button type="button" data-lang="en" onclick="switchLanguage('en')" aria-pressed="false">ENG</button>
        </div>
    </div>
</header>
<main class="block-container">
    <h1 class="page-title" id="page-title">Оформление работы</h1>
    <div id="error-message" class="alert-error" role="alert"></div>
    <div class="file-uploader-box" id="drop-zone">
        <span class="upload-action" id="upload-action">Загрузить документ</span>
        <span id="upload-label"></span>
        <span class="replace-file" id="replace-file-label">Заменить файл</span>
        <input type="file" id="file-input" accept=".docx" aria-label="Загрузить документ DOCX" onchange="handleFile(this)">
    </div>
    <div class="main-layout">
        <aside class="left-settings-col card">
            <div class="settings-heading"><div class="title-subtitle" id="title-settings">Данные работы</div><button type="button" class="st-btn" id="clear-btn" onclick="clearAll()" aria-label="Очистить" title="Очистить">↺</button></div>
            <div class="form-group"><label id="lbl-doc-type" for="document_type">Тип работы</label><select id="document_type"></select></div>
            <div class="form-group"><label id="lbl-number" for="title_number">Номер</label><input type="text" id="title_number"></div>
            <div class="form-group"><label id="lbl-topic" for="title_topic">Тема</label><textarea id="title_topic" rows="2"></textarea></div>
            <div class="form-group">
                <label id="lbl-author" for="title_author">Студенты</label>
                <div id="students-list"><div class="student-row primary-student"><input type="text" id="title_author" aria-label="Студент 1" placeholder="Фамилия Имя"><button type="button" class="add-student" id="add-student-btn" onclick="addStudent()" aria-label="Добавить студента" title="Добавить студента">+</button></div></div>
            </div>
            <div class="form-pair">
                <div class="form-group"><label id="lbl-group" for="title_group">Группа</label><input type="text" id="title_group"></div>
                <div class="form-group"><label id="lbl-code" for="title_code">Специальность</label><input type="text" id="title_code"></div>
            </div>
            <div class="form-group"><label id="lbl-teacher" for="title_teacher">Преподаватель</label><input type="text" id="title_teacher"></div>
            <details><summary id="department-summary">Институт и кафедра</summary><div class="details-body">
                <div class="form-group"><label id="lbl-institute" for="title_institute">Институт</label><select id="title_institute"></select></div>
                <div class="form-group"><label id="lbl-department" for="title_department">Кафедра</label><select id="title_department" disabled></select></div>
            </div></details>
            <details><summary id="settings-title">Параметры оформления</summary><div class="details-body">
                <div class="form-group"><label id="lbl-preset" for="preset_name">Шаблон оформления</label><div class="preset-picker"><input id="preset_name" type="text" maxlength="60" value="ГОСТ" readonly><button id="format_preset" type="button" aria-label="Выбрать или создать шаблон" aria-haspopup="listbox" aria-controls="preset-menu" aria-expanded="false" onclick="togglePresetMenu()"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button><div id="preset-menu" class="preset-menu" role="listbox" aria-labelledby="lbl-preset" inert></div></div></div>
                <div class="preset-actions"><button type="button" class="st-btn" id="save-preset-btn" onclick="saveFormatPreset()" disabled>Сохранить</button><button type="button" class="st-btn" id="delete-preset-btn" onclick="deleteFormatPreset()" aria-label="Удалить шаблон" title="Удалить шаблон" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg></button></div>
                <div id="preset-status" class="preset-status" role="status" aria-live="polite"></div>
                <div class="form-group"><label id="lbl-font-family" for="font_family">Шрифт</label><select id="font_family"><option>Times New Roman</option><option>Arial</option><option>Calibri</option><option>Cambria</option></select></div>
                <div class="form-pair">
                    <div class="form-group"><label id="lbl-font-size" for="font_size">Шрифт (пт)</label><input type="number" id="font_size" min="8" max="30" value="14"></div>
                    <div class="form-group"><label id="lbl-line-spacing" for="line_spacing">Интервал</label><input type="number" id="line_spacing" min="1" max="3" step="0.1" value="1.5"></div>
                </div>
                <div class="form-pair">
                    <div class="form-group"><label id="lbl-left-margin" for="left_margin">Слева (мм)</label><input type="number" id="left_margin" min="0" max="50" value="30"></div>
                    <div class="form-group"><label id="lbl-right-margin" for="right_margin">Справа (мм)</label><input type="number" id="right_margin" min="0" max="50" value="20"></div>
                </div>
                <div class="form-pair">
                    <div class="form-group"><label id="lbl-top-margin" for="top_margin">Сверху (мм)</label><input type="number" id="top_margin" min="0" max="50" value="20"></div>
                    <div class="form-group"><label id="lbl-bottom-margin" for="bottom_margin">Снизу (мм)</label><input type="number" id="bottom_margin" min="0" max="50" value="20"></div>
                </div>
                <div class="form-group"><label id="lbl-first-line-indent" for="first_line_indent">Абзац (мм)</label><input type="number" id="first_line_indent" min="0" max="30" step="0.5" value="12.5"></div>
            </div></details>
            <div class="apply-row">
                <button class="st-btn btn-primary" id="process-btn" onclick="processDocument()" disabled>Применить оформление</button>
            </div>
        </aside>
        <section class="center-main-col">
            <div class="card">
                <div id="title-boundary-panel" hidden>
                    <p id="title-boundary-message"></p><div id="title-boundary-list"></div>
                    <button id="no-title-btn" class="st-btn" onclick="confirmNoTitle()">В документе нет титула</button>
                </div>
                <div class="preview-title-block">
                    <span id="preview-title">Просмотр документа</span>
                    <div class="preview-tabs" role="group" aria-label="Режим просмотра">
                        <button class="preview-tab" id="cover-tab" aria-pressed="false" onclick="setPreviewMode('cover')">Титульный лист</button>
                        <button class="preview-tab active" id="document-tab" aria-pressed="true" onclick="setPreviewMode('document')">Документ</button>
                    </div>
                    <div class="zoom-tools"><button onclick="changeZoom(-10)" aria-label="Уменьшить">−</button><span id="zoom-label">100%</span><button onclick="changeZoom(10)" aria-label="Увеличить">+</button></div>
                </div>
                <div id="docx-preview-box" class="docx-preview docx-preview-empty">DOCX</div>
                <div class="preview-footer"><span id="document-status" role="status" aria-live="polite"></span><span id="page-count">0 / 0</span></div>
            </div>
            <div class="button-row">
                <button class="st-btn" id="download-pdf-btn" onclick="printPDF()" disabled>Печать / PDF</button>
                <button class="st-btn btn-primary" id="download-word-btn" onclick="downloadWord()" disabled>Скачать Word</button>
            </div>
        </section>
    </div>
</main>

<script src="vendor/jszip.min.js"></script>
<script src="vendor/docx-preview.min.js"></script>

<script>
function parseXml(text, name) {
    const xml = new DOMParser().parseFromString(text, 'application/xml');
    if (xml.getElementsByTagName('parsererror').length) throw new Error('Некорректный XML: ' + name);
    return xml;
}

async function openDocx(file) {
    if (!/\.docx$/i.test(file.name)) throw new Error('Поддерживается только DOCX.');
    if (!file.size || file.size > 25 * 1024 * 1024) throw new Error('Размер DOCX должен быть от 1 байта до 25 МБ.');
    if (typeof JSZip === 'undefined') throw new Error('Не загрузилась библиотека JSZip.');
    const buffer = await file.arrayBuffer();
    checkZipLimits(buffer);
    const zip = await JSZip.loadAsync(buffer);
    const documentFile = zip.file('word/document.xml');
    if (!documentFile || !zip.file('[Content_Types].xml') || !zip.file('_rels/.rels')) throw new Error('В файле отсутствуют обязательные части DOCX.');
    const xmlDoc = parseXml(await documentFile.async('string'), 'document.xml');
    if (!xmlDoc.getElementsByTagNameNS(W, 'body')[0]) throw new Error('Основная часть документа отсутствует.');
    return { file: file, zip: zip, xmlDoc: xmlDoc, analysis: analyzeDocument(xmlDoc) };
}

function checkZipLimits(buffer) {
    const view = new DataView(buffer);
    let end = -1;
    for (let position = view.byteLength - 22; position >= Math.max(0, view.byteLength - 65557); position--) {
        if (view.getUint32(position, true) === 0x06054b50 && position + 22 + view.getUint16(position + 20, true) === view.byteLength) { end = position; break; }
    }
    if (end < 0) throw new Error('Файл не является корректным ZIP/DOCX.');
    const count = view.getUint16(end + 10, true);
    let offset = view.getUint32(end + 16, true);
    let total = 0;
    if (count > 3000 || view.getUint16(end + 4, true) || view.getUint16(end + 6, true)) throw new Error('Слишком сложный или неподдерживаемый ZIP/DOCX.');
    for (let index = 0; index < count; index++) {
        if (offset + 46 > end || view.getUint32(offset, true) !== 0x02014b50) throw new Error('Повреждён каталог ZIP.');
        const size = view.getUint32(offset + 24, true);
        total += size;
        if (size > 32 * 1024 * 1024 || total > 100 * 1024 * 1024) throw new Error('Распакованный DOCX превышает допустимый размер.');
        offset += 46 + view.getUint16(offset + 28, true) + view.getUint16(offset + 30, true) + view.getUint16(offset + 32, true);
    }
}

function cleanText(text) {
    return text.normalize('NFKC').replace(/[\u00ac\u00ad\u200b-\u200d\ufeff]/g, '').replace(/\s+/g, ' ').trim();
}

function paragraphText(element) {
    const textNodes = element.querySelectorAll('*');
    let text = '';
    for (let index = 0; index < textNodes.length; index++) {
        if (textNodes[index].namespaceURI === W && textNodes[index].localName === 't') text += textNodes[index].textContent;
    }
    return cleanText(text);
}

function getParagraphs(nodes) {
    const paragraphs = [];
    for (let index = 0; index < nodes.length; index++) {
        if (nodes[index].localName === 'p') paragraphs.push(nodes[index]);
        else {
            const nested = nodes[index].getElementsByTagNameNS(W, 'p');
            for (let position = 0; position < nested.length; position++) paragraphs.push(nested[position]);
        }
    }
    return paragraphs;
}

function titleLines(nodes) {
    const paragraphs = getParagraphs(nodes);
    const lines = [];
    for (let index = 0; index < paragraphs.length; index++) {
        const elements = paragraphs[index].getElementsByTagName('*');
        let text = '';
        for (let position = 0; position < elements.length; position++) {
            const element = elements[position];
            if (element.namespaceURI !== W) continue;
            if (element.localName === 't') text += element.textContent;
            if (element.localName === 'tab' || element.localName === 'br' || element.localName === 'cr') {
                if (cleanText(text)) lines.push(cleanText(text));
                text = '';
            }
        }
        if (cleanText(text)) lines.push(cleanText(text));
    }
    return lines;
}

const METADATA_FIELDS = [
    ['title_topic', ['название работы', 'на тему', 'тема работы', 'тема', 'тематика', 'тему', 'тақырыбы', 'тақырып', 'subject matter', 'subject', 'topic', 'title']],
    ['title_author', ['выполнил студент', 'выполнила студентка', 'выполнила', 'выполнил', 'подготовил', 'подготовила', 'автор', 'студент', 'магистрант', 'орындаған', 'білім алушының аты-жөні', 'білім алушы', 'written by', 'witten by', 'submitted by', 'prepared by', 'author', 'student']],
    ['title_teacher', ['принял преподаватель', 'приняла преподаватель', 'научный руководитель', 'проверила', 'проверил', 'приняла', 'принял', 'преподаватель', 'руководитель', 'тексерген', 'оқытушының аты-жөні', 'оқытушы', 'checked by', 'supervisor', 'instructor', 'teacher']],
    ['title_group', ['учебная группа', 'группа', 'тобы', 'топ', 'group']],
    ['title_code', ['образовательная программа', 'специальность', 'шифр', 'оп', 'мамандық шифрі', 'мамандығы', 'мамандық', 'specialty', 'programme', 'program']],
    ['title_institute', ['институт', 'факультет', 'institute', 'faculty']],
    ['title_department', ['кафедра', 'department']]
];

function metadataLabel(text) {
    let result = null;
    let longest = 0;
    for (let index = 0; index < METADATA_FIELDS.length; index++) {
        const field = METADATA_FIELDS[index][0];
        const aliases = METADATA_FIELDS[index][1];
        for (let position = 0; position < aliases.length; position++) {
            const alias = aliases[position];
            const label = alias.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '\\s+');
            const pattern = new RegExp('^' + label + '(?=$|[\\s:：=–—_\\-(]|\\d)(?:\\s*(?:\\(Ф\\.?\\s*И\\.?\\s*О\\.?\\)|[(:：=–—-])\\s*)?(.*)$', 'iu');
            const match = text.match(pattern);
            if (match && alias.length > longest) {
                result = { field: field, value: match[1].replace(/^[:：\s_]+|[_\s]+$/g, '').trim() };
                longest = alias.length;
            }
        }
    }
    return result;
}

function titleDate(text) {
    const match = text.match(/^(?:[\p{L} .–,-]{1,40}?\s*)?((?:19|20)\d{2})(?:\s*(?:год[а]?|г\.?|ж\.?|жыл|year))?$/iu);
    if (match) return match[1];
    return null;
}

function isFormCodeLine(text) {
    return /^(?:ф|форма|form)\s+/i.test(text) && /\d+(?:[-/]\d+)+/.test(text);
}

function isBodyHeading(text) {
    return /^(?:\d+(?:\.\d+)*[.)]?\s*)?(?:введение|кіріспе|introduction|содержание|мазмұны|contents|основная часть|негізгі бөлім|цель работы|мақсаты)(?:\s*[:.]|$)/i.test(text);
}

function workType(text) {
    let normalized = text;
    if (/[а-яё]/i.test(normalized)) normalized = normalized.replace(/[Aa]/g, 'а');
    normalized = cleanText(normalized).replace(/[’‘]/g, "'").replace(/\s*(?:№|#|no\.?|number)?\s*\d+(?:[.-]\d+)*\s*$/i, '').trim();
    if (/^(?:лабораторн[а-я]*\s+работ[а-я]*|лабораториялық жұмыс|laboratory work)$/i.test(normalized)) return 'lab';
    if (/^(?:курсовая работа|курстық жұмыс)$/i.test(normalized)) return 'course';
    if (/^(?:практическая работа|практикалық жұмыс)$/i.test(normalized)) return 'practical';
    if (/^реферат$/i.test(normalized)) return 'referat';
    if (/^(?:эссе|essay)$/i.test(normalized)) return 'essay';
    if (/^(?:отч[её]т(?: о .+)?|есеп беру|report)$/i.test(normalized)) return 'otchet';
    if (/^(?:срс|сро|сөж)$/i.test(normalized)) return 'srs';
    if (/^(?:срсп|сроп|соөж)$/i.test(normalized)) return 'srsp';
    if (/^siw$/i.test(normalized)) return 'en_siw';
    if (/^тәжірбиелік жұмыс$/i.test(normalized)) return 'tazh';
    normalized = normalized.toLowerCase().replace(/\s*\([^)]*\)\s*/g, '').trim();
    for (let index = 0; index < ENTRIES.length; index++) {
        const entry = ENTRIES[index];
        const russian = entry.ru.toLowerCase().replace(/\s*\([^)]*\)\s*/g, '').trim();
        const kazakh = entry.kk.toLowerCase().replace(/\s*\([^)]*\)\s*/g, '').trim();
        if (normalized === russian || normalized === kazakh) return entry.id;
    }
    return null;
}

function isGeneratedTitle(element) {
    if (!element || element.localName !== 'sdt') return false;
    const tags = element.getElementsByTagNameNS(W, 'tag');
    for (let index = 0; index < tags.length; index++) {
        if (tags[index].getAttributeNS(W, 'val') === 'norm-title-v1') return true;
    }
    return false;
}

function inspectTitle(xmlDoc, startIndex) {
    const body = xmlDoc.getElementsByTagNameNS(W, 'body')[0];
    if (!body) return { state: 'absent', range: null };
    const children = Array.from(body.children);
    const start = startIndex || 0;
    if (isGeneratedTitle(children[start])) return { state: 'existing', range: [children[start]], endIndex: start };
    let end = -1;
    let dateEnd = -1;
    let seenText = false;
    let mixedBreak = false;
    for (let index = start; index < Math.min(children.length, start + 80); index++) {
        const element = children[index];
        const text = paragraphText(element);
        if (dateEnd >= 0 && text && !isFormCodeLine(text)) { end = dateEnd; break; }
        if (isBodyHeading(text)) {
            if (index === start) return { state: 'absent', range: null };
            end = index - 1;
            break;
        }
        if (text) seenText = true;
        const properties = child(element, 'pPr');
        const breakBefore = properties && child(properties, 'pageBreakBefore');
        if (index > start && breakBefore && breakBefore.getAttributeNS(W, 'val') !== '0') { end = index - 1; break; }
        const breaks = element.getElementsByTagNameNS(W, 'br');
        let pageBreak = null;
        for (let position = 0; position < breaks.length; position++) {
            if (breaks[position].getAttributeNS(W, 'type') === 'page') { pageBreak = breaks[position]; break; }
        }
        if (seenText && element.localName === 'p' && (pageBreak || (properties && child(properties, 'sectPr')))) {
            if (pageBreak) {
                const textNodes = element.getElementsByTagNameNS(W, 't');
                let before = false;
                let after = false;
                for (let position = 0; position < textNodes.length; position++) {
                    if (!textNodes[position].textContent.trim()) continue;
                    if (textNodes[position].compareDocumentPosition(pageBreak) & Node.DOCUMENT_POSITION_FOLLOWING) before = true;
                    if (pageBreak.compareDocumentPosition(textNodes[position]) & Node.DOCUMENT_POSITION_FOLLOWING) after = true;
                }
                if (after && !before) { end = index - 1; break; }
                if (before && after) mixedBreak = true;
            }
            end = index;
            break;
        }
        const lines = titleLines([element]);
        if (titleDate(text) || (lines.length && titleDate(lines[lines.length - 1]))) dateEnd = index;
        if (element.localName === 'sectPr') break;
    }
    if (end < start && dateEnd >= start) end = dateEnd;
    const range = [];
    let limit = Math.min(children.length, start + 40);
    if (end >= start) limit = end + 1;
    for (let index = start; index < limit; index++) {
        if (children[index].localName !== 'sectPr') range.push(children[index]);
    }
    const lines = titleLines(range);
    const university = /университет|university|академи|колледж/i.test(lines.join(' '));
    let hasType = false;
    const labels = [];
    for (let index = 0; index < lines.length; index++) {
        if (workType(lines[index]) || /^(?:дипломн[а-я]+\s+(?:работа|проект)|диссертация|доклад|семестровая работа|bachelor.?s thesis|master.?s thesis|диссертациялық жұмыс)$/i.test(lines[index])) hasType = true;
        const label = metadataLabel(lines[index]);
        if (label && labels.indexOf(label.field) < 0) labels.push(label.field);
    }
    if (hasType && (university || labels.length >= 2) && end >= start && !mixedBreak) return { state: 'existing', range: range, endIndex: end };
    if (hasType || (university && labels.length >= 1)) return { state: 'uncertain', range: null };
    return { state: 'absent', range: null };
}

function titleRange(xmlDoc) {
    return inspectTitle(xmlDoc).range;
}

function addMetadataValue(values, field, value) {
    if (!values[field]) values[field] = [];
    if (values[field].indexOf(value) < 0) values[field].push(value);
}

function metadataLines(nodes) {
    const paragraphs = getParagraphs(nodes);
    const lines = [];
    for (let index = 0; index < paragraphs.length; index++) {
        let table = paragraphs[index].parentNode;
        while (table && table.localName !== 'tbl') table = table.parentNode;
        if (table && /качество выполнения|диапазон оцен|requirements for|assessment criteria|баға диапазоны|жұмысты орындау сапасы/i.test(paragraphText(table))) continue;
        const paragraphLines = titleLines([paragraphs[index]]);
        let parent = paragraphs[index].parentNode;
        let student = false;
        while (parent) {
            if (parent.localName === 'sdt') {
                const tag = parent.getElementsByTagNameNS(W, 'tag')[0];
                if (tag && tag.getAttributeNS(W, 'val') === 'norm-student-v1') student = true;
            }
            parent = parent.parentNode;
        }
        if (student && paragraphLines.length) paragraphLines[0] = 'Студент: ' + paragraphLines[0];
        for (let position = 0; position < paragraphLines.length; position++) lines.push(paragraphLines[position]);
    }
    return lines;
}

function extractMetadata(xmlDoc, titleInfo) {
    const body = xmlDoc.getElementsByTagNameNS(W, 'body')[0];
    const info = titleInfo || inspectTitle(xmlDoc);
    let nodes = info.range;
    if (!nodes) nodes = Array.from(body.children).slice(0, 80);
    const lines = metadataLines(nodes);
    const metadata = {};
    const values = {};
    for (let index = 0; index < lines.length; index++) {
        const line = lines[index];
        if (isBodyHeading(line)) break;
        if (!metadata.docTypeId) {
            metadata.docTypeId = workType(line);
            if (metadata.docTypeId) {
                const number = line.match(/(?:№|#|no\.?)\s*(\d+(?:[.-]\d+)*)\s*$/i);
                if (number) metadata.title_number = number[1];
            }
        }
        for (let institutionIndex = 0; institutionIndex < UNIVERSITY.length; institutionIndex++) {
            const institution = UNIVERSITY[institutionIndex];
            for (const lang in institution.name) {
                if (institution.name[lang] === line) addMetadataValue(values, 'title_institute', line);
            }
            for (let departmentIndex = 0; departmentIndex < institution.departments.length; departmentIndex++) {
                const department = institution.departments[departmentIndex];
                for (const lang in department.name) {
                    if (department.name[lang] === line) addMetadataValue(values, 'title_department', line);
                }
            }
        }
        const date = titleDate(line);
        if (date) metadata.title_year = date;
        const label = metadataLabel(line);
        if (label) {
            let value = label.value;
            const next = lines[index + 1] || '';
            if (!value && next && !isBodyHeading(next) && !workType(next) && !metadataLabel(next) && !titleDate(next) && !/^№/.test(next)) value = next;
            if (value && (label.field === 'title_institute' || label.field === 'title_department')) value = label.value ? line : cleanText(line + ' ' + value);
            if (value && value.length < 500 && !/^[_\s%]+$/.test(value)) addMetadataValue(values, label.field, value);
        }
        const suffix = line.match(/^(.+?)\s+(институты|кафедрасы)$/i);
        if (suffix && !/_{3}/.test(suffix[1])) {
            let field = 'title_department';
            if (/институт/i.test(suffix[2])) field = 'title_institute';
            addMetadataValue(values, field, line);
        }
    }
    for (const field in values) {
        if (values[field].length === 1) metadata[field] = values[field][0];
    }
    if (values.title_author && values.title_author.length) {
        metadata.students = values.title_author;
        metadata.title_author = values.title_author[0];
    }
    if (!metadata.title_topic && !values.title_topic && info.range) {
        const paragraphs = getParagraphs(info.range);
        let typeIndex = -1;
        for (let index = 0; index < paragraphs.length; index++) {
            if (workType(paragraphText(paragraphs[index]))) { typeIndex = index; break; }
        }
        for (let index = typeIndex + 1; typeIndex >= 0 && index < paragraphs.length; index++) {
            const paragraph = paragraphs[index];
            const text = paragraphText(paragraph);
            if (!text) continue;
            if (inTable(paragraph) || metadataLabel(text) || titleDate(text) || isBodyHeading(text)) break;
            const properties = child(paragraph, 'pPr');
            const alignment = properties && child(properties, 'jc');
            const centred = alignment && alignment.getAttributeNS(W, 'val') === 'center';
            if (text.length >= 8 && text.length <= 500 && !/^[\d_\s%№]+$/.test(text) && (centred || /^[«"“].+[»"”]$/.test(text))) metadata.title_topic = text;
            break;
        }
    }
    const text = lines.join(' ');
    metadata.language = 'en';
    if (/[а-яё]/i.test(text)) metadata.language = 'ru';
    if (/[әғқңөұүһі]/i.test(text)) metadata.language = 'kk';
    if (metadata.language === 'en' && metadata.docTypeId === 'lab') metadata.docTypeId = 'en_lab';
    if (metadata.language === 'en' && metadata.docTypeId === 'otchet') metadata.docTypeId = 'en_report';
    return metadata;
}

function analyzeDocument(xmlDoc) {
    const firstTitle = inspectTitle(xmlDoc);
    const analysis = { state: firstTitle.state, boundary: null, metadata: extractMetadata(xmlDoc, firstTitle) };
    if (firstTitle.state !== 'existing') return analysis;
    let nextIndex = firstTitle.endIndex + 1;
    analysis.boundary = { blockIndex: firstTitle.endIndex, breakIndex: null };
    for (let count = 0; count < 20; count++) {
        const nextTitle = inspectTitle(xmlDoc, nextIndex);
        if (nextTitle.state === 'absent') return analysis;
        if (nextTitle.state === 'uncertain') {
            analysis.state = 'uncertain';
            analysis.boundary = null;
            return analysis;
        }
        const extra = extractMetadata(xmlDoc, nextTitle);
        for (const field in extra) {
            if (!analysis.metadata[field]) analysis.metadata[field] = extra[field];
        }
        analysis.boundary.blockIndex = nextTitle.endIndex;
        nextIndex = nextTitle.endIndex + 1;
    }
    analysis.state = 'uncertain';
    analysis.boundary = null;
    return analysis;
}

function getBoundaryOptions(xmlDoc) {
    const body = xmlDoc.getElementsByTagNameNS(W, 'body')[0];
    const options = [];
    for (let blockIndex = 0; blockIndex < Math.min(body.children.length, 120); blockIndex++) {
        const element = body.children[blockIndex];
        if (element.localName === 'sectPr') continue;
        if (element.localName === 'p') {
            const breaks = element.getElementsByTagNameNS(W, 'br');
            for (let breakIndex = 0; breakIndex < breaks.length; breakIndex++) {
                const range = xmlDoc.createRange();
                range.selectNodeContents(element);
                range.setEndBefore(breaks[breakIndex]);
                const text = paragraphText(range.cloneContents());
                if (text) options.push({ blockIndex: blockIndex, breakIndex: breakIndex, text: text + ' ↵' });
            }
        }
        let text = paragraphText(element);
        if (!text && element.getElementsByTagNameNS(W, 'drawing').length) text = 'Логотип / сурет';
        if (!text) text = 'Пустая строка / бос жол';
        options.push({ blockIndex: blockIndex, breakIndex: null, text: text });
    }
    return options;
}

function removeTitlePrefix(xmlDoc, boundary) {
    const body = xmlDoc.getElementsByTagNameNS(W, 'body')[0];
    const children = Array.from(body.children);
    const element = children[boundary.blockIndex];
    if (!element || element.localName === 'sectPr') throw new Error('Неверная граница титула.');
    if (boundary.breakIndex !== null) {
        const pageBreak = element.getElementsByTagNameNS(W, 'br')[boundary.breakIndex];
        if (element.localName !== 'p' || !pageBreak) throw new Error('Неверная граница титула.');
        const range = xmlDoc.createRange();
        const properties = child(element, 'pPr');
        if (properties) range.setStartAfter(properties);
        else range.setStart(element, 0);
        range.setEndAfter(pageBreak);
        range.deleteContents();
    }
    for (let index = 0; index < boundary.blockIndex; index++) body.removeChild(children[index]);
    if (boundary.breakIndex === null) body.removeChild(element);
}

function metadataFromBoundary(xmlDoc, boundary) {
    const copy = xmlDoc.cloneNode(true);
    const body = copy.getElementsByTagNameNS(W, 'body')[0];
    const element = body.children[boundary.blockIndex];
    if (boundary.breakIndex !== null) {
        const pageBreak = element.getElementsByTagNameNS(W, 'br')[boundary.breakIndex];
        const range = copy.createRange();
        range.selectNodeContents(element);
        range.setStartBefore(pageBreak);
        range.deleteContents();
    }
    while (body.children.length > boundary.blockIndex + 1) body.removeChild(body.lastElementChild);
    return extractMetadata(copy, { range: Array.from(body.children) });
}

async function preparePackage(zip) {
    const relationshipNamespace = 'http://schemas.openxmlformats.org/package/2006/relationships';
    const typeNamespace = 'http://schemas.openxmlformats.org/package/2006/content-types';
    const relationshipFile = zip.file('word/_rels/document.xml.rels');
    let relationshipText = '<Relationships xmlns="' + relationshipNamespace + '"/>';
    if (relationshipFile) relationshipText = await relationshipFile.async('string');
    const relDoc = parseXml(relationshipText, 'relationships');
    const ctDoc = parseXml(await zip.file('[Content_Types].xml').async('string'), 'content types');
    const ids = [];
    for (let index = 0; index < relDoc.documentElement.children.length; index++) {
        const id = relDoc.documentElement.children[index].getAttribute('Id');
        if (ids.indexOf(id) >= 0) throw new Error('В исходном DOCX обнаружены повторяющиеся ID связей.');
        ids.push(id);
    }
    function addRel(type, target) {
        const relationships = relDoc.documentElement.children;
        for (let index = 0; index < relationships.length; index++) {
            const relationship = relationships[index];
            if (relationship.getAttribute('Type') === type && relationship.getAttribute('Target') === target && relationship.getAttribute('TargetMode') !== 'External') return relationship.getAttribute('Id');
        }
        let number = 1;
        while (ids.indexOf('rIdNorm' + number) >= 0) number++;
        const id = 'rIdNorm' + number;
        ids.push(id);
        const relationship = relDoc.createElementNS(relationshipNamespace, 'Relationship');
        relationship.setAttribute('Id', id);
        relationship.setAttribute('Type', type);
        relationship.setAttribute('Target', target);
        relDoc.documentElement.appendChild(relationship);
        return id;
    }
    function contentType(kind, key, type) {
        let attribute = 'PartName';
        if (kind === 'Default') attribute = 'Extension';
        const types = ctDoc.documentElement.children;
        for (let index = 0; index < types.length; index++) {
            if (types[index].localName === kind && types[index].getAttribute(attribute) === key) return;
        }
        const element = ctDoc.createElementNS(typeNamespace, kind);
        element.setAttribute(attribute, key);
        element.setAttribute('ContentType', type);
        ctDoc.documentElement.appendChild(element);
    }
    function uniquePart(base) {
        let name = base;
        let number = 1;
        while (zip.file('word/' + name)) {
            name = base.replace(/(\.[^.]+)$/, '_' + number + '$1');
            number++;
        }
        return name;
    }
    const footerName = uniquePart('norm_footer.xml');
    const footerId = addRel(R + '/footer', footerName);
    contentType('Override', '/word/' + footerName, 'application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml');
    contentType('Default', 'rels', 'application/vnd.openxmlformats-package.relationships+xml');
    return { relDoc: relDoc, ctDoc: ctDoc, addRel: addRel, contentType: contentType, uniquePart: uniquePart, footerId: footerId, footerName: footerName };
}

    function instituteByName(value) {

        for (let index = 0; index < UNIVERSITY.length; index++) {

            for (const lang in institute.name) {

    function refreshUniversityFields(instituteValue, departmentValue) {
        const instituteSelect = document.getElementById('title_institute');
        const departmentSelect = document.getElementById('title_department');
        const selected = instituteByName(instituteValue);
        instituteSelect.innerHTML = '';
        instituteSelect.add(new Option(uiText('Выберите институт', 'Институтты таңдаңыз', 'Select an institute'), ''));
        for (let index = 0; index < UNIVERSITY.length; index++) {
            const institute = UNIVERSITY[index];
            const name = institute.name[currentLang];
            instituteSelect.add(new Option(name, name));
        }
        if (selected) instituteValue = selected.name[currentLang];
        else if (instituteValue) instituteSelect.add(new Option(instituteValue, instituteValue));
        instituteSelect.value = instituteValue;

        departmentSelect.innerHTML = '';
        let placeholder = uiText('Сначала выберите институт', 'Алдымен институтты таңдаңыз', 'Select an institute first');
        if (selected) placeholder = selected.departments.length
            ? uiText('Выберите кафедру', 'Кафедраны таңдаңыз', 'Select a department')
            : uiText('Не найдено', 'Табылмады', 'Not found');
        if (!selected && instituteValue) placeholder = uiText('Кафедра из документа', 'Құжаттағы кафедра', 'Department from the document');
        departmentSelect.add(new Option(placeholder, ''));
        if (selected) {
            for (let index = 0; index < selected.departments.length; index++) {
                const department = selected.departments[index];
                for (const lang in department.name) {
                    if (department.name[lang] === departmentValue) departmentValue = department.name[currentLang];
                }
                const name = department.name[currentLang];
                departmentSelect.add(new Option(name, name));
            }
        }
        let found = !departmentValue;
        for (let index = 0; index < departmentSelect.options.length; index++) {
            if (departmentSelect.options[index].value === departmentValue) found = true;
        }
        if (!found) departmentSelect.add(new Option(departmentValue, departmentValue));
        departmentSelect.value = departmentValue;
        departmentSelect.disabled = !departmentValue && (!selected || !selected.departments.length);
    }

    function validFormatValues(values) {
        if (!values || typeof values !== 'object') return false;
        const fonts = document.getElementById('font_family').options;
        let knownFont = false;
        for (let index = 0; index < fonts.length; index++) {
            if (fonts[index].value === values.font_family) knownFont = true;
        }
        if (!knownFont) return false;
        for (let index = 1; index < SETTING_IDS.length; index++) {
            const id = SETTING_IDS[index];
            const input = document.getElementById(id);
            if (typeof values[id] !== 'number' || !Number.isFinite(values[id]) || values[id] < Number(input.min) || values[id] > Number(input.max)) return false;
        }
        return true;
    }

    function writeFormatValues(values) {
        for (let index = 0; index < SETTING_IDS.length; index++) {
            const id = SETTING_IDS[index];
            document.getElementById(id).value = values[id];
        }

    function selectFormatPreset(id) {
        togglePresetMenu(false);
        if (id === 'new') { newFormatPreset(); return; }
        let values = GOST_SETTINGS;
        let name = 'ГОСТ';
        selectedPreset = 'gost';
        for (let index = 0; index < formatPresets.length; index++) {
            if (formatPresets[index].id === id) {
                selectedPreset = id;
                name = formatPresets[index].name;
                values = formatPresets[index].values;
                break;
            }
        }
        writeFormatValues(values);
        const locked = selectedPreset === 'gost';
        for (let index = 0; index < SETTING_IDS.length; index++) document.getElementById(SETTING_IDS[index]).disabled = locked;
        document.getElementById('preset_name').value = name;
        document.getElementById('preset_name').readOnly = locked;
        document.getElementById('save-preset-btn').disabled = locked;
        document.getElementById('delete-preset-btn').disabled = locked;
        document.getElementById('preset-status').textContent = '';
        renderFormatPresets();
        updatePresetLabels();
        scheduleProcess();

    function newFormatPreset() {
        let values;
        try { values = readFormatValues(); } catch (error) { showError(error.message); return; }
        const id = 'custom-' + Date.now();
        formatPresets.push({ id: id, name: uiText("Новый шаблон", "Жаңа үлгі", "New preset"), values: values });
        selectFormatPreset(id);
        document.getElementById('preset-status').textContent = uiText("Укажите название и нажмите «Сохранить».", "Атауын енгізіп, сақтаңыз.", "Enter a name and click Save.");

        document.getElementById('preset_name').select();

    function persistFormatPresets() {
        try { localStorage.setItem('norm_format_presets', JSON.stringify(formatPresets)); }
        catch (error) { throw new Error(uiText("Браузер не разрешает сохранить шаблоны.", "Браузер үлгілерді сақтауға рұқсат бермейді.", "Your browser does not allow saving presets.")); }
    }

    function saveFormatPreset() {
        if (selectedPreset === 'gost') return;
        try {
            const name = document.getElementById('preset_name').value.trim();
            if (!name || name.length > 60 || name.toUpperCase() === 'ГОСТ') throw new Error(uiText("Укажите своё название шаблона, отличное от «ГОСТ».", "Басқа атауды енгізіңіз.", "Enter a preset name other than GOST."));
            for (let index = 0; index < formatPresets.length; index++) {
                if (formatPresets[index].id !== selectedPreset && formatPresets[index].name.toLowerCase() === name.toLowerCase()) throw new Error(uiText("Шаблон с таким названием уже существует.", "Бұл атау қолданылған.", "A preset with this name already exists."));
            }
            const values = readFormatValues();
            for (let index = 0; index < formatPresets.length; index++) {
                if (formatPresets[index].id === selectedPreset) {
                    const previous = formatPresets[index];
                    formatPresets[index] = { id: selectedPreset, name: name, values: values };
                    try { persistFormatPresets(); } catch (error) { formatPresets[index] = previous; throw error; }
                    break;
                }
            }
            renderFormatPresets();
            showError('');
            document.getElementById('preset-status').textContent = uiText("Шаблон сохранён в этом браузере.", "Үлгі осы браузерде сақталды.", "Preset saved in this browser.");
        } catch (error) { showError(error.message); }
    }

    function deleteFormatPreset() {
        if (selectedPreset === 'gost') return;
        for (let index = 0; index < formatPresets.length; index++) {
            if (formatPresets[index].id === selectedPreset) {
                const removed = formatPresets.splice(index, 1)[0];
                try { persistFormatPresets(); }
                catch (error) { formatPresets.splice(index, 0, removed); showError(error.message); return; }
                break;
            }
        }
        showError('');
        selectFormatPreset('gost');
    }

    function initFormatPresets() {
        try {
            const saved = JSON.parse(load('format_presets') || '[]');
            if (Array.isArray(saved)) {
                for (let index = 0; index < saved.length; index++) {
                    const preset = saved[index];
                    if (!preset || typeof preset.id !== 'string' || preset.id.indexOf('custom-') !== 0 || typeof preset.name !== 'string' || !preset.name.trim() || preset.name.length > 60 || preset.name.toUpperCase() === 'ГОСТ' || !validFormatValues(preset.values)) continue;
                    let duplicate = false;
                    for (let position = 0; position < formatPresets.length; position++) {
                        if (formatPresets[position].id === preset.id) duplicate = true;
                    }
                    if (!duplicate) formatPresets.push(preset);
                }
            }
        } catch (error) { formatPresets = []; }
        selectFormatPreset('gost');
    }

    async function handleFile(input) {
        if (input.files && input.files[0]) {
            clearTimeout(debounceTimer);
            const token = ++runToken;
            selectedFile = input.files[0];
            const file = selectedFile;
            importPending = true;
            invalidateResult();
            for (let index = 0; index < FIELD_IDS.length; index++) document.getElementById(FIELD_IDS[index]).value = '';
            importedDocument = null;
            changedFields = {};
            setStudents([]);
            hideTitleBoundary();
            sourceLang = null;
            importSummary = '';
            document.getElementById('document-status').textContent = '';
            const sizeKb = (selectedFile.size / 1024).toFixed(1);
            document.getElementById('upload-label').innerText = `${selectedFile.name} (${sizeKb} KB)`;
            document.getElementById('process-btn').disabled = true;
            const box = document.getElementById('docx-preview-box');
            box.replaceChildren();
            box.classList.add('docx-preview-empty');
            showError('');
            try {
                const opened = await openDocx(file);
                if (token !== runToken) return;
                importedDocument = opened;
                applyMetadata(opened.analysis.metadata);
                importPending = false;
                if (opened.analysis.state === 'uncertain') {
                    showTitleBoundary();
                    document.getElementById('process-btn').innerText = TEXTS[currentLang].process_button;
                    return;
                }
                await processDocument();
            } catch (e) {
                if (token !== runToken) return;
                importPending = false;
                selectedFile = null;
                importedDocument = null;
                showError(e.message || TEXTS[currentLang].error_docx);
            }
        }
    }

    function child(parent, name) {
        for (const c of parent.children) if (c.localName === name && c.namespaceURI === W) return c;
        return null;
    }
    function setAttrs(e, attrs) { for (const k in attrs) e.setAttributeNS(W, 'w:' + k, String(attrs[k])); }
    function ensure(parent, name, order) {
        let c = child(parent, name);
        if (c) return c;
        c = parent.ownerDocument.createElementNS(W, 'w:' + name);
        const idx = order.indexOf(name);
        let before = null;
        for (const x of parent.children) {
            if (order.indexOf(x.localName) > idx) { before = x; break; }
        }
        parent.insertBefore(c, before);
        return c;
    }
    function removeAll(parent, name) {
        for (const c of Array.from(parent.children)) if (c.localName === name) parent.removeChild(c);
    }
    function inTable(node) {
        for (let n = node.parentNode; n; n = n.parentNode) if (n.localName === 'tbl') return true;
        return false;
    }
    function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function readSettings() {
        readFormatValues();
        function num(id, def) {
            const input = document.getElementById(id);
            const v = input.value === '' ? def : Number(input.value);
            if (!Number.isFinite(v) || v < Number(input.min) || v > Number(input.max)) {
                throw new Error((uiText("Недопустимый параметр: ", "Жарамсыз параметр: ", "Invalid setting: ")) + id);
            }
            return v;
        }
        return {
            fontFamily: document.getElementById('font_family').value || FONT,
            fontSize: num('font_size', 14), lineSpacing: num('line_spacing', 1.5),
            left: num('left_margin', 30), right: num('right_margin', 20),
            top: num('top_margin', 20), bottom: num('bottom_margin', 20),
            indent: num('first_line_indent', 12.5),
            docTypeId: document.getElementById('document_type').value,
            number: document.getElementById('title_number').value.trim(),
            topic: document.getElementById('title_topic').value.trim(),
            author: document.getElementById('title_author').value.trim(),
